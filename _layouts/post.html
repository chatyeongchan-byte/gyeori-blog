---
layout: default
---
<article class="post">
  <header class="post-head">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %-m월 %-d일" }}</time>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <div class="furrow end" aria-hidden="true"></div>
  <nav class="post-nav"><a href="{{ '/' | relative_url }}">← 일기 목록</a></nav>
</article>
